<style>
:root{
  --bg:#101015; --surface:#252229; --surface-2:#1b1a20; --line:#34303a; --text:#f5f2ef; --muted:#a39ba8; --faint:#2c2931;
  --accent:#ff8858; --accent-ink:#1d0f08; --accent-soft:rgba(255,136,88,.38); --danger:#ff6b6b; --ok:#ff8858;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#101015; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#101015; --surface:#252229; --surface-2:#1b1a20; --line:#34303a; --text:#f5f2ef; --muted:#a39ba8; --faint:#2c2931; --accent:#ff8858; --accent-ink:#1d0f08; --accent-soft:rgba(255,136,88,.38); color-scheme:dark; }
:root[data-theme="light"]{ --bg:#f5f3f1; --surface:#ffffff; --surface-2:#ece8e5; --line:#ddd7d2; --text:#17151a; --muted:#6c6570; --faint:#e6e1dd; --accent:#e5622f; --accent-ink:#ffffff; --accent-soft:rgba(229,98,47,.32); --shadow:0 8px 24px rgba(40,20,10,.08); color-scheme:light; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; background:var(--bg); color:var(--text); }
body{ font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:1.45; min-height:100%; -webkit-tap-highlight-color:transparent; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; border:0; background:none; padding:0; touch-action:manipulation; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:10px; }
.num{ font-variant-numeric:tabular-nums; }
.app{ max-width:480px; margin:0 auto; padding:18px 18px calc(96px + env(safe-area-inset-bottom,0px)); }
.muted{ color:var(--muted); }
.small{ font-size:13px; }
h1,h2,h3{ margin:0; letter-spacing:-.02em; }
h2{ font-size:22px; font-weight:700; }
h3{ font-size:17px; font-weight:650; }
.page-title{ font-size:32px; font-weight:800; letter-spacing:-.035em; margin:6px 0 18px; }
.card{ background:var(--surface); border-radius:22px; padding:18px; }
.stack>*+*{ margin-top:12px; }
.row{ display:flex; align-items:center; gap:12px; }
.between{ justify-content:space-between; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 2px 10px; }
.link{ color:var(--accent); font-weight:600; font-size:15px; padding:8px 4px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 22px; border-radius:16px; font-weight:650; font-size:16px; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
.btn-ghost{ background:var(--surface-2); color:var(--text); }
.btn-danger{ background:transparent; color:var(--danger); border:1.5px solid color-mix(in srgb,var(--danger) 45%,transparent); }
.btn-block{ width:100%; }
.btn:active{ transform:scale(.98); }
svg.i{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* hero */
.top{ display:flex; justify-content:space-between; align-items:center; min-height:40px; }
.date-line{ font-size:15px; color:var(--muted); font-weight:500; }
.level-pill{ display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:var(--surface); font-weight:650; font-size:14px; }
.level-pill svg{ width:16px; height:16px; color:var(--accent); }
.hero{ margin:22px 0 8px; }
.hero-day{ display:flex; align-items:flex-end; gap:10px; line-height:.86; }
.hero-day .big{ font-size:104px; font-weight:800; letter-spacing:-.06em; }
.hero-day .of{ font-size:22px; font-weight:600; color:var(--muted); padding-bottom:10px; }
.hero-label{ font-size:17px; font-weight:600; margin-bottom:6px; color:var(--muted); }
.track{ display:flex; gap:2px; height:34px; align-items:flex-end; margin:22px 0 10px; }
.track span{ flex:1; height:22px; border-radius:2px; background:var(--faint); transition:background .3s, height .3s; }
.track .s-done{ background:var(--accent); }
.track .s-partial{ background:var(--accent-soft); }
.track .s-missed{ background:var(--line); height:12px; }
.track .s-rest{ background:var(--line); }
.track .s-today{ height:34px; background:var(--text); }
.track .s-today.s-done{ background:var(--accent); }
.track-meta{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); }

.stats3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:22px; }
.stat{ background:var(--surface); border-radius:18px; padding:14px 14px 12px; }
.stat .v{ font-size:26px; font-weight:750; letter-spacing:-.03em; display:flex; align-items:center; gap:5px; }
.stat .v svg{ width:20px; height:20px; color:var(--accent); }
.stat .k{ font-size:13px; color:var(--muted); margin-top:2px; }
.xp{ margin-top:10px; }
.bar{ height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.bar > i{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
.xp-meta{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:8px; }
.xp-meta b{ color:var(--text); font-weight:650; }
.quote{ margin-top:10px; font-size:16px; line-height:1.5; }
.quote .muted{ display:block; margin-top:6px; font-size:13px; }

/* habits */
.habit{ width:100%; display:flex; align-items:center; gap:14px; text-align:left; background:var(--surface); border-radius:20px; padding:14px 14px 14px 14px; min-height:72px; transition:background .2s; }
.habit + .habit{ margin-top:8px; }
.habit .ico{ width:44px; height:44px; border-radius:14px; display:grid; place-items:center; background:var(--surface-2); color:var(--text); flex:none; }
.habit .txt{ flex:1; min-width:0; }
.habit .name{ font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.habit .cat{ font-size:13px; color:var(--muted); }
.check{ width:34px; height:34px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; flex:none; transition:all .2s; color:transparent; }
.check svg{ width:18px; height:18px; stroke-width:3; }
.habit.done .check{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.habit.done .name{ color:var(--muted); }
.habit.done .ico{ color:var(--accent); }
.habit.locked{ opacity:.55; cursor:default; }
.habit .chev{ color:var(--muted); }
.habit.soon .ico{ color:var(--muted); }
.habit.soon .name{ color:var(--muted); }
.coach-cta{ margin-bottom:14px; border-color:color-mix(in srgb,var(--accent) 40%,transparent); }
.coach-cta .ico{ color:var(--accent); }
.coach-cta > svg{ color:var(--muted); }
.empty{ text-align:center; padding:28px 18px; color:var(--muted); }
.empty .btn{ margin-top:14px; }
.pop{ animation:pop .35s ease; }
@keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }

/* calendar */
.legend{ display:flex; flex-wrap:wrap; gap:8px 14px; font-size:13px; color:var(--muted); margin-bottom:16px; }
.legend i{ display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:6px; vertical-align:-1px; }
.cal-head,.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-head{ font-size:12px; color:var(--muted); text-align:center; margin-bottom:6px; font-weight:600; }
.cell{ aspect-ratio:1; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:650; font-size:15px; background:var(--surface); position:relative; overflow:hidden; }
.cell small{ font-size:9.5px; font-weight:500; color:var(--muted); line-height:1; margin-top:2px; }
.cell.blank{ background:transparent; }
.cell .fill{ position:absolute; left:0; right:0; bottom:0; background:var(--accent-soft); }
.cell > b,.cell > small{ position:relative; }
.cell.c-done{ background:var(--accent); color:var(--accent-ink); }
.cell.c-done small{ color:var(--accent-ink); opacity:.7; }
.cell.c-missed{ background:var(--surface-2); color:var(--muted); }
.cell.c-missed::after{ content:""; position:absolute; width:14px; height:2px; background:var(--muted); bottom:7px; border-radius:2px; opacity:.6; }
.cell.c-upcoming{ background:transparent; border:1.5px dashed var(--line); color:var(--muted); }
.cell.c-rest{ background:var(--surface-2); }
.cell.c-today{ box-shadow:inset 0 0 0 2.5px var(--text); }
.cell .sh{ position:absolute; top:4px; right:4px; color:var(--accent); line-height:0; }
.cell .sh svg,svg.lg-sh{ width:12px; height:12px; stroke-width:2.6; }
svg.lg-sh{ color:var(--accent); margin-right:6px; vertical-align:-1px; }
.track .s-shield{ background:color-mix(in srgb,var(--accent) 50%,var(--line)); height:16px; }
.shields{ display:inline-flex; align-items:center; gap:2px; margin-left:6px; color:var(--accent); font-weight:650; }
.shields svg{ width:13px; height:13px; stroke-width:2.6; }
.shield-row{ display:flex; gap:8px; }
.shield-row svg{ width:30px; height:30px; color:var(--line); }
.shield-row svg.on{ color:var(--accent); fill:color-mix(in srgb,var(--accent) 25%,transparent); }
.mini66 .m-part{ background:var(--accent-soft); } .mini66 .m-shield{ background:color-mix(in srgb,var(--accent) 50%,var(--line)); }
.season{ width:100%; display:block; text-align:left; background:var(--surface); border-radius:20px; padding:14px; }
.season + .season{ margin-top:8px; }
.season .row{ margin-bottom:12px; }
.season .lt{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-family:var(--dirt); font-size:22px; background:var(--rc); color:#0b0d14; flex:none; }
.season .grow{ flex:1; min-width:0; }

/* stats */
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.chart{ width:100%; height:auto; display:block; }
.hbar{ display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center; }
.hbar .bar{ grid-column:1 / -1; height:7px; margin-bottom:10px; }
.ach{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.ach > div{ background:var(--surface); border-radius:18px; padding:14px; }
.ach .badge{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--surface-2); color:var(--muted); margin-bottom:10px; }
.ach .on .badge{ background:var(--accent); color:var(--accent-ink); }
.ach .t{ font-weight:650; font-size:15px; }
.ach .d{ font-size:12.5px; color:var(--muted); margin-top:2px; }
.ach .off .t{ color:var(--muted); }

/* settings */
.list{ background:var(--surface); border-radius:20px; overflow:hidden; }
.item{ width:100%; display:flex; align-items:center; gap:14px; padding:15px 16px; min-height:58px; text-align:left; }
.item + .item{ border-top:1px solid var(--line); }
.item .grow{ flex:1; }
.item .sub{ font-size:13px; color:var(--muted); }
.seg{ display:inline-flex; background:var(--surface-2); padding:3px; border-radius:12px; }
.seg button{ padding:8px 14px; border-radius:9px; font-size:14px; font-weight:600; color:var(--muted); min-height:36px; }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.2); }
.note{ font-size:13.5px; color:var(--muted); line-height:1.5; padding:12px 4px 0; }
.warn{ background:color-mix(in srgb,var(--danger) 14%,var(--surface)); color:var(--text); border-radius:16px; padding:12px 14px; font-size:14px; margin-bottom:14px; }

/* nav */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
.nav-in{ max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
.nav button{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 0 9px; font-size:11px; font-weight:600; color:var(--muted); min-height:60px; }
.nav button[aria-current="page"]{ color:var(--accent); }

/* sheet */
.scrim{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease; }
.sheet{ width:100%; max-width:480px; max-height:calc(100% - 40px - env(safe-area-inset-top,0px)); overflow:auto; background:var(--bg); border-radius:26px 26px 0 0; padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px)); animation:up .28s cubic-bezier(.2,.8,.2,1); -webkit-overflow-scrolling:touch; }
.grab{ width:40px; height:5px; border-radius:9px; background:var(--line); margin:0 auto 10px; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
.sheet-head h2{ font-size:22px; }
.x{ width:40px; height:40px; border-radius:50%; background:var(--surface); display:grid; place-items:center; flex:none; }
@keyframes up{ from{ transform:translateY(40px); opacity:0 } }
@keyframes fade{ from{ opacity:0 } }
label.f{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin:16px 2px 8px; }
.input{ width:100%; min-height:52px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); padding:12px 14px; font-size:16px; }
.input:focus{ border-color:var(--accent); outline:none; }
textarea.input{ min-height:120px; font-size:13px; font-family:ui-monospace,Menlo,monospace; }
.icons{ display:grid; grid-template-columns:repeat(8,1fr); gap:6px; }
.icons button{ aspect-ratio:1; border-radius:12px; background:var(--surface); display:grid; place-items:center; color:var(--muted); }
.icons button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ padding:10px 14px; border-radius:999px; background:var(--surface); font-weight:600; font-size:14.5px; min-height:44px; display:inline-flex; align-items:center; gap:8px; border:1.5px solid transparent; }
.chip[aria-pressed="true"]{ border-color:var(--accent); color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,var(--surface)); }
.days7{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.days7 button{ min-height:44px; border-radius:12px; background:var(--surface); font-weight:650; font-size:14px; color:var(--muted); }
.days7 button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
.actions{ display:grid; gap:10px; margin-top:22px; }
.actions.two{ grid-template-columns:1fr 1fr; }
.mini66{ display:grid; grid-template-columns:repeat(11,1fr); gap:4px; }
.mini66 span{ aspect-ratio:1; border-radius:4px; background:var(--faint); }
.mini66 .m-done{ background:var(--accent); } .mini66 .m-miss{ background:var(--line); } .mini66 .m-off{ background:transparent; border:1px solid var(--faint); } .mini66 .m-today{ box-shadow:inset 0 0 0 2px var(--text); }

/* coach */
.bot{ display:flex; gap:10px; align-items:flex-end; margin-top:12px; }
.bot .av{ width:34px; height:34px; border-radius:11px; display:grid; place-items:center; flex:none; background:linear-gradient(160deg,#121a2c,#0c101b); border:1px solid rgba(110,185,255,.55); color:#7cc4ff; box-shadow:0 0 14px rgba(80,160,255,.2); }
.bot .av svg{ width:18px; height:18px; }
.bubble{ background:var(--surface); border-radius:18px 18px 18px 6px; padding:11px 14px; font-size:15px; max-width:85%; }
.me{ display:flex; justify-content:flex-end; margin-top:12px; }
.me .bubble{ background:var(--accent); color:var(--accent-ink); border-radius:18px 18px 6px 18px; font-weight:600; }
.co-opts{ display:grid; gap:8px; margin-top:14px; }
.co-opts .pick + .pick{ margin-top:0; }
.co-opts .pick > svg{ color:var(--muted); }
.plan-item{ background:var(--surface); border-radius:18px; padding:12px 12px 12px 14px; margin-top:8px; }
.bot + .plan-item{ margin-top:14px; }
.plan-item .ico{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--surface-2); color:var(--accent); flex:none; }
.plan-item .grow{ flex:1; min-width:0; }
.plan-item .x{ width:34px; height:34px; background:var(--surface-2); }
.plan-item .x svg{ width:16px; height:16px; }
.plan-item ol{ list-style:none; margin:10px 0 0; padding:0 0 0 52px; font-size:13px; color:var(--muted); }
.plan-item li + li{ margin-top:3px; }
.plan-item li b{ color:var(--text); font-weight:600; }

/* onboarding */
.ob{ position:fixed; inset:0; z-index:30; background:var(--bg); overflow:auto; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
.ob-in{ max-width:480px; margin:0 auto; min-height:100%; padding:22px 20px 28px; display:flex; flex-direction:column; }
.ob-steps{ display:flex; gap:5px; margin-bottom:28px; }
.ob-steps i{ flex:1; height:4px; border-radius:4px; background:var(--surface); }
.ob-steps i.on{ background:var(--accent); }
.ob h1{ font-size:40px; font-weight:800; letter-spacing:-.045em; line-height:1.02; margin-bottom:14px; }
.ob p.lead{ font-size:17px; color:var(--muted); margin:0 0 22px; max-width:34ch; }
.ob .grow{ flex:1; }
.ob-foot{ display:flex; gap:10px; margin-top:26px; position:sticky; bottom:0; padding-top:12px; background:linear-gradient(transparent,var(--bg) 30%); }
.ob-foot .btn-primary{ flex:1; }
.welcome-mark{ font-size:132px; font-weight:800; letter-spacing:-.07em; line-height:.85; margin:30px 0 24px; }
.welcome-mark span{ color:var(--accent); }
.pick{ width:100%; display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:18px; background:var(--surface); text-align:left; min-height:64px; border:1.5px solid transparent; }
.pick + .pick{ margin-top:8px; }
.pick[aria-pressed="true"]{ border-color:var(--accent); }
.pick .ico{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--surface-2); }
.pick[aria-pressed="true"] .ico{ color:var(--accent); }
.pick .grow{ flex:1; font-weight:600; }
.pick .check{ width:28px; height:28px; }
.pick[aria-pressed="true"] .check{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.rules{ display:grid; gap:10px; margin-top:6px; }
.rules > div{ display:flex; gap:14px; align-items:flex-start; background:var(--surface); border-radius:18px; padding:14px; }
.rules b{ display:block; }
.rules .ico{ width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:var(--surface-2); color:var(--accent); flex:none; }

/* toasts */
.toasts{ position:fixed; left:0; right:0; top:calc(12px + env(safe-area-inset-top,0px)); z-index:60; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 16px; }
.toast{ background:var(--surface); color:var(--text); border-radius:16px; padding:12px 16px; font-weight:600; font-size:14.5px; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; animation:tin .3s ease; max-width:440px; border:1px solid var(--line); }
.toast svg{ color:var(--accent); width:20px; height:20px; }
@keyframes tin{ from{ transform:translateY(-10px); opacity:0 } }
.float-xp{ position:fixed; z-index:55; font-weight:800; font-size:16px; color:var(--accent); pointer-events:none; animation:floatup 1s ease forwards; }
.float-xp.neg{ color:var(--muted); }
@keyframes floatup{ to{ transform:translateY(-44px); opacity:0 } }
.lvl{ text-align:center; padding:18px 4px 6px; }
.lvl .n{ font-size:96px; font-weight:800; letter-spacing:-.06em; line-height:1; color:var(--accent); }

/* hunter system */
.aura-card{ width:100%; display:grid; grid-template-columns:132px 1fr; gap:6px; align-items:center; text-align:left; margin-top:10px; border-radius:24px; padding:6px 18px 6px 4px; color:#eef3ff;
  background:radial-gradient(120% 90% at 18% 60%, color-mix(in srgb,var(--aura) 22%,transparent), transparent 60%), linear-gradient(160deg,#141826,#0b0d14 70%); position:relative; overflow:hidden; border:1px solid color-mix(in srgb,var(--aura) 35%,transparent); }
.aura-card .bar{ background:rgba(255,255,255,.1); }
.aura-card .bar i{ background:var(--aura); box-shadow:0 0 12px var(--aura); }
.aura-info .rk{ display:flex; align-items:center; gap:10px; }
.rank-letter{ font-size:52px; font-weight:800; line-height:1; letter-spacing:-.04em; color:var(--aura); text-shadow:0 0 18px color-mix(in srgb,var(--aura) 70%,transparent); }
.aura-info .ttl{ font-weight:700; font-size:17px; }
.aura-info .sub{ font-size:12.5px; color:#9aa4bd; }
.aura-info .lv{ font-size:13px; color:#c7d0e6; margin:10px 0 6px; display:flex; justify-content:space-between; }
svg.aura{ width:100%; height:auto; display:block; overflow:visible; }
.aura .fl{ transform-box:fill-box; transform-origin:50% 100%; animation:flick 1.6s ease-in-out infinite alternate; }
.aura .fl.b{ animation-duration:2.1s; animation-delay:-.7s; } .aura .fl.c{ animation-duration:1.3s; animation-delay:-.3s; }
@keyframes flick{ 0%{ transform:scaleY(.86) scaleX(1.04); opacity:.75 } 100%{ transform:scaleY(1.1) scaleX(.96); opacity:1 } }
.aura .pt{ animation:rise 3s linear infinite; opacity:0; }
@keyframes rise{ 0%{ transform:translateY(0); opacity:0 } 15%{ opacity:1 } 100%{ transform:translateY(-120px); opacity:0 } }
.aura .eyes{ animation:glint 4s ease-in-out infinite; }
@keyframes glint{ 0%,90%,100%{ opacity:.9 } 95%{ opacity:.2 } }
.quest{ margin-top:26px; border-radius:22px; padding:16px 16px 14px; background:linear-gradient(160deg,#121a2c,#0c101b); border:1px solid rgba(110,185,255,.45); box-shadow:0 0 22px rgba(80,160,255,.14), inset 0 0 18px rgba(80,160,255,.08); color:#e6f1ff; margin-bottom:12px; }
.quest .qh{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
.quest .tag{ font-size:12px; font-weight:700; letter-spacing:.14em; color:#7cc4ff; }
.quest h2{ font-size:20px; margin-top:4px; color:#fff; }
.quest p{ margin:4px 0 0; font-size:13.5px; color:#a9bad6; }
.quest .qn{ font-size:26px; font-weight:800; color:#7cc4ff; }
.quest.sysup{ margin-top:22px; margin-bottom:0; }
.quest.sysup + .quest{ margin-top:10px; }
.quest.sysup p{ display:flex; align-items:center; gap:8px; color:#e6f1ff; margin-top:8px; }
.quest.sysup p svg{ width:18px; height:18px; color:#7cc4ff; }
.quest.sysup .was{ color:#a9bad6; font-size:12.5px; }
.quest.clear{ border-color:var(--accent); box-shadow:0 0 26px color-mix(in srgb,var(--accent) 30%,transparent); }
.quest.clear .tag,.quest.clear .qn{ color:var(--accent); }
.toast.sys{ background:linear-gradient(160deg,#121a2c,#0c101b); color:#e6f1ff; border:1px solid rgba(110,185,255,.55); box-shadow:0 0 20px rgba(80,160,255,.25); }
.toast.sys svg{ color:#7cc4ff; }
.sysbox{ border-radius:22px; padding:22px 18px; text-align:center; background:linear-gradient(160deg,#121a2c,#0b0f1a); border:1px solid rgba(110,185,255,.55); box-shadow:0 0 30px rgba(80,160,255,.22), inset 0 0 22px rgba(80,160,255,.1); color:#e6f1ff; }
.sysbox .tag{ font-size:12px; font-weight:700; letter-spacing:.18em; color:#7cc4ff; }
.sysbox .n{ font-size:92px; font-weight:800; letter-spacing:-.06em; line-height:1.05; color:#fff; text-shadow:0 0 24px rgba(120,190,255,.7); }
.sysbox p{ color:#a9bad6; margin:6px 0 0; }
.rank-hero{ border-radius:24px; overflow:hidden; background:radial-gradient(90% 70% at 50% 60%, color-mix(in srgb,var(--aura) 26%,transparent), transparent 70%), linear-gradient(170deg,#141826,#08090f); padding:6px 22px 18px; text-align:center; color:#eef3ff; }
.rank-hero svg.aura{ max-width:200px; margin:0 auto; }
.ladder{ display:grid; gap:8px; }
.ladder-plan > div{ display:flex; align-items:center; gap:12px; padding:8px 0; }
.ladder-plan > div + div{ border-top:1px solid var(--line); }
.ladder-plan span{ width:56px; flex:none; font-size:13px; color:var(--muted); }
.ladder-plan b{ flex:1; font-weight:600; font-size:15px; }
.ladder-plan .past b{ color:var(--muted); text-decoration:line-through; text-decoration-thickness:1px; }
.ladder-plan .now b{ color:var(--accent); }
.ladder-plan em{ font-style:normal; font-size:12px; font-weight:700; color:var(--accent-ink); background:var(--accent); padding:3px 8px; border-radius:99px; }
.ladder > div{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:18px; background:var(--surface); }
.ladder .lt{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-weight:800; font-size:22px; background:var(--surface-2); color:var(--muted); flex:none; }
.ladder .on .lt{ background:var(--rc); color:#0b0d14; box-shadow:0 0 16px color-mix(in srgb,var(--rc) 60%,transparent); }
.ladder .cur{ box-shadow:inset 0 0 0 2px var(--rc); }
.ladder .grow{ flex:1; }
.statrow{ display:grid; grid-template-columns:92px 1fr 34px; gap:10px; align-items:center; font-size:14px; }
.statrow + .statrow{ margin-top:10px; }
.statrow b{ font-weight:650; }
.statrow .bar{ height:7px; }

/* game typography */
:root{ --dirt:'Rubik Dirt',Impact,'Arial Black',sans-serif; --sport:'Bebas Neue',Impact,'Arial Narrow',sans-serif; }
.page-title{ font-family:var(--dirt); font-weight:400; font-size:40px; letter-spacing:.5px; text-transform:uppercase; line-height:1; margin:10px 0 20px; }
.hero-day .big{ font-family:var(--sport); font-weight:400; font-size:150px; letter-spacing:0; line-height:.8; }
.hero-day .of{ font-family:var(--sport); font-size:30px; letter-spacing:2px; padding-bottom:12px; }
.hero-label{ font-family:var(--sport); font-size:26px; letter-spacing:4px; color:var(--accent); }
.stat .v{ font-family:var(--sport); font-weight:400; font-size:36px; letter-spacing:.5px; line-height:1; }
.level-pill{ font-family:var(--sport); font-weight:400; font-size:19px; letter-spacing:1.5px; }
.rank-letter{ font-family:var(--dirt); font-weight:400; font-size:58px; }
.aura-info .ttl{ font-family:var(--sport); font-weight:400; font-size:26px; letter-spacing:1.5px; line-height:1; }
.aura-info .lv{ font-family:var(--sport); font-size:18px; letter-spacing:1px; }
.quest .tag,.sysbox .tag{ font-family:var(--sport); font-weight:400; font-size:18px; letter-spacing:4px; }
.quest h2{ font-family:var(--dirt); font-weight:400; font-size:22px; letter-spacing:.3px; text-transform:uppercase; }
.quest .qn{ font-family:var(--sport); font-weight:400; font-size:40px; }
.section-head h2{ font-family:var(--sport); font-weight:400; font-size:28px; letter-spacing:1.5px; }
.sysbox .n{ font-family:var(--dirt); font-weight:400; }
.ladder .lt{ font-family:var(--dirt); font-weight:400; }
.sheet-head h2{ font-family:var(--sport); font-weight:400; font-size:30px; letter-spacing:1.5px; }
.ob h1{ font-family:var(--dirt); font-weight:400; font-size:42px; letter-spacing:0; line-height:1.02; text-transform:uppercase; }
.welcome-mark{ font-family:var(--dirt); font-weight:400; letter-spacing:0; }
.btn-primary{ font-family:var(--sport); font-weight:400; font-size:23px; letter-spacing:2px; }
.nav button span{ font-family:var(--sport); font-size:15px; font-weight:400; letter-spacing:1.2px; }
.ach .t{ font-family:var(--sport); font-weight:400; font-size:21px; letter-spacing:1px; }
.toast.sys span{ font-family:var(--sport); font-weight:400; font-size:19px; letter-spacing:1px; }
/* figure motion */
.aura .fl{ transform-box:fill-box; transform-origin:50% 100%; animation:flick 1.5s ease-in-out infinite alternate; }
.aura .body{ animation:bob 2.4s ease-in-out infinite; }
.pose-float .body{ animation:hover 2.8s ease-in-out infinite; }
.pose-sprint .spd,.pose-punch .spd{ animation:dash .5s linear infinite; }
.pose-punch .hit{ transform-box:fill-box; transform-origin:center; animation:hit 1.2s ease-out infinite; }
.aura .glow{ transform-box:fill-box; transform-origin:center; animation:pulse 2.4s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-4px) } }
@keyframes hover{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-14px) } }
@keyframes dash{ from{ transform:translateX(16px); opacity:.2 } to{ transform:translateX(-24px); opacity:.8 } }
@keyframes hit{ 0%{ transform:scale(.6); opacity:1 } 70%{ transform:scale(1.15); opacity:.9 } 100%{ transform:scale(.6); opacity:.4 } }
@keyframes pulse{ 0%,100%{ opacity:.85; transform:scale(1) } 50%{ opacity:1; transform:scale(1.04) } }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation:none!important; transition:none!important; } }
</style>

function scheduled(h,date){
  if(h.createdOn&&date<h.createdOn) return false;
  if(h.archivedOn&&date>=h.archivedOn) return false;
  if(h.unlock&&S.startDate&&dayNum(date)<h.unlock) return false;

function stageOf(h,date){ if(!h.ladder||!S.startDate) return -1; const dn=dayNum(date); let k=0; h.ladder.forEach((s,i)=>{ if(s.d<=dn) k=i; }); return k; }

/* what changes on a given day: new habits and level-ups */
function changesOn(date){

    if(h.unlock===dn) out.push({t:'new',h,name:hName(h,date)});
    else if(h.ladder){ const k=h.ladder.findIndex(s=>s.d===dn); if(k>0) out.push({t:'up',h,from:h.ladder[k-1].name,name:h.ladder[k].name,lv:k+1,of:h.ladder.length}); } }
  return out;
}
function dayData(date){

}
function compute(){
  const t=today(), start=S.startDate;
  const r={day:0,started:false,finished:false,xp:0,cur:0,best:0,perfectDays:0,anyDone:false,days:[],todayPct:0,day66perfect:false,shields:0,shieldsEarned:0,shieldsUsed:0};
  if(!start) return r;
  r.day=diff(start,t)+1; r.started=r.day>=1; r.finished=r.day>TOTAL;
  let run=0, sh=0;
  for(let i=0;i<TOTAL;i++){
    const date=addDays(start,i), dd=dayData(date);
    let status, shield=false;
    if(date>t) status='upcoming';
    else{
      const perfect=dd.total>0&&dd.done===dd.total;
      if(dd.done>0) r.anyDone=true;
      r.xp+=dd.done*XP_HABIT;
      if(perfect){ r.xp+=XP_PERFECT; r.perfectDays++; run++; if(run%7===0){ r.xp+=XP_STREAK7; r.shieldsEarned++; if(sh<MAX_SHIELDS) sh++; } if(i===TOTAL-1) r.day66perfect=true; }
      else if(dd.total>0&&date<t){ if(sh>0){ sh--; r.shieldsUsed++; shield=true; } else run=0; }
      r.best=Math.max(r.best,run);
      status=dd.total===0?'rest':perfect?'done':dd.done>0?'partial':(date===t?'open':'missed');
    }
    r.days.push({i:i+1,date,status,shield,done:dd.done,total:dd.total,isToday:date===t});
  }
  r.cur=run; r.shields=sh;
  if(r.started&&!r.finished){ const dd=dayData(t); r.todayPct=dd.total?Math.round(dd.done/dd.total*100):0; }

  r.progress=Math.round(reached/TOTAL*100);

}
function habitStats(h){
  const t=today(); let sched=0,done=0;
  if(!S.startDate) return {sched,done,rate:0};
  for(let i=0;i<TOTAL;i++){
    const date=addDays(S.startDate,i); if(date>t) break;
    if(!scheduled(h,date)) continue;
    const did=(S.completions[date]||[]).includes(h.id);
    if(date===t&&!did) continue;
    sched++; if(did) done++;

const KEY='reset66-state', PREV='reset66-prev';
const Store={idb:null,mode:'memory',ok:true};
function idbOpen(){
  return new Promise((res)=>{
    let done=false; const fin=v=>{if(!done){done=true;res(v);}};
    setTimeout(()=>fin(null),2500);
    try{
      if(!window.indexedDB) return fin(null);
      const rq=indexedDB.open('reset66',1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
      rq.onsuccess=()=>fin(rq.result); rq.onerror=()=>fin(null); rq.onblocked=()=>fin(null);
    }catch(e){ fin(null); }
  });
}
function idbGet(k){return new Promise((res)=>{try{const q=Store.idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}

}
async function rawSave(k,v){

const Cloud={ref:null,status:'off',timer:null,busy:false,again:false};

async function cloudPush(){
  if(!Cloud.ref) return; if(Cloud.busy){Cloud.again=true;return;}
  Cloud.busy=true;
  try{ await Cloud.ref.set({json:JSON.stringify(S),updatedAt:S.updatedAt}); Cloud.status='on'; }
  catch(e){ Cloud.status='error'; }

async function cloudInit(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    Cloud.ref=db.collection('data/users/'+id).doc('reset66');
    const snap=await Cloud.ref.get();
    let remote=null;
    if(snap.exists){ try{ remote=migrate(JSON.parse(snap.data().json)); }catch(e){ remote=null; } }
    if(remote&&remote.onboarded&&(remote.updatedAt||0)>(S.updatedAt||0)){
      await keepPrevious();
      S=remote; await rawSave(KEY,JSON.parse(JSON.stringify(S)));
      baseline=compute(); applyTheme(); render();
      toast('Restored your latest progress from your Claude account','cloud');
      Cloud.status='on';
    }else if(S.onboarded){ cloudPush(); }

  }catch(e){ Cloud.status='error'; }
}

function migrate(o){
  if(!o||typeof o!=='object') throw new Error('Not a RESET / 66 backup');
  if(o.app==='reset66'&&o.state) o=o.state;
  const s=blank();
  s.onboarded=!!o.onboarded;
  s.startDate=isDate(o.startDate)?o.startDate:null;
  s.goals=Array.isArray(o.goals)?o.goals.filter(g=>typeof g==='string'):[];
  s.theme=o.theme==='light'?'light':'dark';
  s.updatedAt=Number(o.updatedAt)||0;
  s.habits=Array.isArray(o.habits)?o.habits.filter(h=>h&&typeof h.id==='string'&&typeof h.name==='string').map(h=>({
    id:h.id,name:h.name.slice(0,60),icon:HABIT_ICONS.includes(h.icon)?h.icon:'star',
    category:CATEGORIES.includes(h.category)?h.category:'Other',
    days:Array.isArray(h.days)?h.days.filter(d=>Number.isInteger(d)&&d>=0&&d<=6):[],
    createdOn:isDate(h.createdOn)?h.createdOn:null,archivedOn:isDate(h.archivedOn)?h.archivedOn:null,
    unlock:Number.isInteger(h.unlock)&&h.unlock>1&&h.unlock<=TOTAL?h.unlock:null,ladder:cleanLadder(h.ladder)
  })):[];
  const ids=new Set(s.habits.map(h=>h.id));
  if(o.completions&&typeof o.completions==='object'){
    for(const [d,arr] of Object.entries(o.completions)){
      if(isDate(d)&&Array.isArray(arr)){ const c=[...new Set(arr.filter(x=>ids.has(x)))]; if(c.length) s.completions[d]=c; }
    }
  }
  s.season=Number.isInteger(o.season)&&o.season>0?o.season:1;
  s.history=Array.isArray(o.history)?o.history.map(cleanSeason).filter(Boolean):[];
  if(s.onboarded&&(!s.startDate||!s.habits.length)) s.onboarded=!!s.startDate;
  return s;
}
function cleanLadder(l){
  if(!Array.isArray(l)) return null;
  const s=l.filter(x=>x&&Number.isInteger(x.d)&&x.d>=1&&x.d<=TOTAL&&typeof x.name==='string'&&x.name.trim()).map(x=>({d:x.d,name:x.name.slice(0,60)})).sort((a,b)=>a.d-b.d);
  return s.length>1?s:null;
}
function cleanSeason(e){
  if(!e||typeof e!=='object'||!isDate(e.startDate)) return null;
  const num=x=>Math.max(0,Math.floor(Number(x)||0)), stats={};
  for(const [k] of STATS) stats[k]=num(e.stats&&e.stats[k]);
  return {season:num(e.season)||1,startDate:e.startDate,endedOn:isDate(e.endedOn)?e.endedOn:e.startDate,
    daysReached:Math.min(TOTAL,num(e.daysReached)),xp:num(e.xp),level:num(e.level)||1,perfectDays:num(e.perfectDays),best:num(e.best),
    shieldsUsed:num(e.shieldsUsed),ach:num(e.ach),days:typeof e.days==='string'?e.days.replace(/[^dpmrsu]/g,'').slice(0,TOTAL):'',stats,
    habits:Array.isArray(e.habits)?e.habits.filter(h=>h&&typeof h.name==='string').slice(0,40).map(h=>({name:h.name.slice(0,60),icon:HABIT_ICONS.includes(h.icon)?h.icon:'star',done:num(h.done),sched:num(h.sched)})):[]};
}

  const el=document.createElement('div'); el.className='float-xp'+(delta<0?' neg':''); el.textContent=(delta>0?'+':'−')+Math.abs(delta)+' XP';
  el.style.left=Math.max(8,rect.left+rect.width-110)+'px'; el.style.top=(rect.top+rect.height/2-12)+'px';

  if(after.shieldsEarned>before.shieldsEarned&&after.shields>before.shields) toast('Streak shield earned. It saves your streak if you miss a day.','shield',true);

  return '<h1 class="page-title">Progress</h1>'+

   '<div class="card row" style="margin-top:10px"><div class="grow"><div class="muted small">Streak shields</div><h3 style="margin-top:4px" class="num">'+c.shields+' of '+MAX_SHIELDS+'</h3><div class="muted small">'+(c.shieldsUsed?'Saved your streak '+c.shieldsUsed+(c.shieldsUsed===1?' time':' times'):'Earn one with every 7-day streak')+'</div></div><div class="shield-row" aria-hidden="true">'+Array.from({length:MAX_SHIELDS},(_,i)=>ic('shield',i<c.shields?'on':'')).join('')+'</div></div>'+

/* ---------- sheets ---------- */
let sheet=null; // {type, arg}
function openSheet(type,arg){ sheet={type,arg}; renderSheet(true); }
function closeSheet(){ sheet=null; renderSheet(); }
function renderSheet(fresh,force){
  const host=document.getElementById('sheet-root');
  if(!sheet){ host.innerHTML=''; document.body.style.overflow=''; return; }
  const live=sheet.type==='day'||sheet.type==='habit';
  if(!fresh&&!live&&!force&&host.innerHTML) return; // keep form inputs intact
  const scroll=host.querySelector('.sheet')?host.querySelector('.sheet').scrollTop:0;
  const html=SHEETS[sheet.type](sheet.arg);
  if(html==null){ sheet=null; host.innerHTML=''; return; }
  host.innerHTML='<div class="scrim" data-a="scrim"'+(fresh?'':' style="animation:none"')+'><div class="sheet" role="dialog" aria-modal="true"'+(fresh?'':' style="animation:none"')+'><div class="grab"></div>'+html+'</div></div>';
  document.body.style.overflow='hidden';
  if(!fresh) host.querySelector('.sheet').scrollTop=scroll;
  else{ const f=host.querySelector('[autofocus]'); if(f&&!('ontouchstart' in window)) f.focus(); }
}

    return head('Hunter path')+
     '<div class="rank-hero" style="--aura:'+rk.c+'">'+auraSVG(c.level)+'<div class="rank-letter" style="font-size:64px">'+rk.r+'</div><div style="font-weight:700;font-size:18px">'+rk.t+', Level '+c.level+'</div><div class="small" style="color:#9aa4bd;margin-top:2px">'+rk.d+'</div></div>'+
     '<label class="f">Stats</label><div class="card">'+STATS.map(([k,nm])=>'<div class="statrow"><b>'+nm+'</b><div class="bar"><i style="width:'+Math.round(st[k]/mx*100)+'%"></i></div><span class="num" style="text-align:right">'+st[k]+'</span></div>').join('')+
     '<p class="note" style="padding-top:12px">Every habit you complete adds a point. Fitness builds Strength, Health builds Vitality, Learning builds Intelligence, Mind builds Focus, and everything else builds Willpower.</p></div>'+

  start(){
    return head('Start date')+'<p class="muted" style="margin:-4px 0 0">Changing the start date moves all 66 days. Your check-ins stay on the dates you made them.</p><label class="f" for="sd">Day 1</label><input class="input" type="date" id="sd" value="'+S.startDate+'"><p class="note" id="sd-err" style="color:var(--danger)"></p><div class="actions"><button class="btn btn-primary" data-a="saveStart">Save start date</button></div>';
  },
  text(o){
    return head(o.title)+'<p class="muted" style="margin:-4px 0 12px">'+o.body+'</p><textarea class="input" id="tx" '+(o.readonly?'readonly':'placeholder="Paste your backup here"')+'>'+esc(o.value||'')+'</textarea><p class="note" id="tx-err" style="color:var(--danger)"></p><div class="actions">'+(o.readonly?'<button class="btn btn-primary" data-a="copyText">'+ic('copy')+'Copy</button>':'<button class="btn btn-primary" data-a="importText">Import pasted backup</button><button class="btn btn-ghost" data-a="pickFile">'+ic('upload')+'Choose a file instead</button>')+'</div>';
  },
  coach(){
    const f=sheet.form||(sheet.form={step:0,goals:[],time:null,level:null,plan:null});
    const bot=t=>'<div class="bot"><span class="av">'+ic('zap')+'</span><div class="bubble">'+t+'</div></div>';
    const me=t=>'<div class="me"><div class="bubble">'+esc(t)+'</div></div>';
    const opt=(a,v,label,sub)=>'<button class="pick" data-a="'+a+'" data-v="'+v+'"><span class="grow">'+label+(sub?'<div class="muted small" style="font-weight:500">'+sub+'</div>':'')+'</span>'+ic('right')+'</button>';
    let h=head('Your coach')+bot('I’ll build you a 66-day plan that starts easy and levels up as you do. What do you want to improve? Pick up to 3.');
    if(f.step===0){
      h+='<div class="chips" style="margin-top:14px">'+GOALS.map(g=>'<button class="chip" data-a="coGoal" data-k="'+g.k+'" aria-pressed="'+f.goals.includes(g.k)+'">'+g.n+'</button>').join('')+'</div>'+
        '<div class="actions"><button class="btn btn-primary" data-a="coNext">'+(f.goals.length?'Next':'Not sure, skip')+'</button></div>';
      return h;
    }
    h+=me(f.goals.length?f.goals.map(k=>GOALS.find(g=>g.k===k).n).join(', '):'Not sure yet')+bot('How much time can you give this each day, in total?');
    if(f.step===1) return h+'<div class="co-opts">'+COACH_TIME.map(([v,l,mx])=>opt('coTime',v,l,'Up to '+mx+' habits')).join('')+'</div><div class="actions"><button class="btn btn-ghost" data-a="coBack">Back</button></div>';
    h+=me(COACH_TIME.find(x=>x[0]===f.time)[1])+bot('Where are you starting from?');
    if(f.step===2) return h+'<div class="co-opts">'+COACH_LEVEL.map((l,i)=>opt('coLevel',i,l,['I’ll start with the smallest steps','I’ll start one step up','I’ll start two steps up'][i])).join('')+'</div><div class="actions"><button class="btn btn-ghost" data-a="coBack">Back</button></div>';
    h+=me(COACH_LEVEL[f.level]);
    if(!f.plan.length) return h+bot('There aren’t enough days left in this season for a new plan. Start a new season from Settings, then come back and I’ll plan it.')+'<div class="actions"><button class="btn btn-ghost" data-a="close">Close</button></div>';
    const base=f.plan[0].unlock;
    h+=bot('Here’s your plan. You start with '+Math.min(2,f.plan.length)+' easy '+(f.plan.length===1?'habit':'habits')+(f.plan.length>2?', and a new one unlocks every 2 weeks':'')+'. Each habit steps up a level as you go, so it never feels like too much at once.');
    h+=f.plan.map((p,i)=>'<div class="plan-item"><div class="row"><span class="ico">'+ic(p.icon)+'</span><span class="grow"><b>'+esc(p.ladder[0].name)+'</b><div class="small" style="color:'+(p.unlock>base?'#7cc4ff':'var(--muted)')+'">'+(p.unlock>base?'Unlocks on Day '+p.unlock:'Starts '+(base>1?'today':'on Day 1'))+'</div></span>'+(f.plan.length>1?'<button class="x" data-a="coDrop" data-i="'+i+'" aria-label="Remove '+esc(p.ladder[0].name)+'">'+ic('x')+'</button>':'')+'</div>'+
      (p.ladder.length>1?'<ol>'+p.ladder.slice(1).map(s=>'<li>Day '+s.d+': <b>'+esc(s.name)+'</b></li>').join('')+'</ol>':'')+'</div>').join('');
    if(S.onboarded) h+='<p class="note">Your current habits move to Archived and keep their history, so your streak and XP so far stay the same.</p>';
    return h+'<div class="actions"><button class="btn btn-primary" data-a="coUse">Use this plan</button><button class="btn btn-ghost" data-a="coRestart">Start over</button></div>';
  },
  newSeason(){
    const c=compute(), active=S.habits.filter(h=>!h.archivedOn);
    const f=sheet.form||(sheet.form={keep:active.map(h=>h.id),start:'today'});
    const nx=S.season+1;
    const early=c.started&&!c.finished?'<div class="warn">You’re on Day '+c.day+' of Season '+S.season+'. Starting now saves it as it is, ending on Day '+c.day+'.</div>':'';
    return head('Season '+nx)+early+'<p class="muted" style="margin:-4px 0 0">Season '+S.season+' is saved on your Progress page. Your rank, level and XP carry over, and the 66-day calendar starts fresh.</p>'+
     '<label class="f">Habits to keep</label>'+(active.length?active.map(h=>'<button class="pick" data-a="nsPick" data-id="'+h.id+'" aria-pressed="'+f.keep.includes(h.id)+'"><span class="ico">'+ic(h.icon)+'</span><span class="grow">'+esc(h.name)+'<div class="muted small" style="font-weight:500">'+esc(h.category)+'</div></span><span class="check">'+ic('check')+'</span></button>').join(''):'<p class="muted small">You have no active habits. You can add some after you start.</p>')+
     '<p class="note">You can add new habits once the season starts.</p>'+
     '<label class="f">Day 1</label><div class="chips"><button class="chip" data-a="nsStart" data-v="today" aria-pressed="'+(f.start==='today')+'">Today</button><button class="chip" data-a="nsStart" data-v="tomorrow" aria-pressed="'+(f.start==='tomorrow')+'">Tomorrow</button></div>'+
     '<p class="note" id="ns-err" style="color:var(--danger)"></p>'+
     '<div class="actions"><button class="btn btn-primary" data-a="nsGo">Start Season '+nx+'</button></div>';
  },
  seasonView(i){
    const e=S.history[i]; if(!e) return null;
    const rk=rankOf(e.level), hs=[...e.habits].sort((a,b)=>b.done/b.sched-a.done/a.sched);
    return head('Season '+e.season)+'<p class="muted" style="margin:-8px 0 16px">'+nice(e.startDate,{day:'numeric',month:'long',year:'numeric'})+' to '+nice(e.endedOn,{day:'numeric',month:'long',year:'numeric'})+'</p>'+
     '<div class="grid2"><div class="stat" style="--rc:'+rk.c+'"><div class="v" style="color:'+rk.c+'">'+rk.r+'</div><div class="k">Rank at the end, Level '+e.level+'</div></div><div class="stat"><div class="v num">'+n(e.xp)+'</div><div class="k">XP this season</div></div>'+
     '<div class="stat"><div class="v num">'+e.perfectDays+'</div><div class="k">Perfect days</div></div><div class="stat"><div class="v num">'+e.best+'</div><div class="k">Best streak</div></div></div>'+
     '<label class="f">66 days</label><div class="card">'+miniGrid(e.days)+'<div class="legend" style="margin:12px 0 0"><span><i style="background:var(--accent)"></i>Perfect</span><span><i style="background:var(--accent-soft)"></i>Partly done</span><span><i style="background:var(--line)"></i>Missed</span><span><i style="background:color-mix(in srgb,var(--accent) 50%,var(--line))"></i>Shield used</span></div></div>'+
     (hs.length?'<label class="f">Habits</label><div class="card hbar">'+hs.map(h=>'<span>'+esc(h.name)+'</span><span class="num muted small">'+h.done+'/'+h.sched+'</span><div class="bar"><i style="width:'+Math.round(h.done/h.sched*100)+'%"></i></div>').join('')+'</div>':'')+
     '<p class="note">'+e.ach+' of '+ACH.length+' achievements unlocked'+(e.shieldsUsed?', '+e.shieldsUsed+' shield'+(e.shieldsUsed>1?'s':'')+' used':'')+(e.daysReached<TOTAL?'. Ended early on Day '+e.daysReached:'')+'.</p>';
  }
};
let pendingConfirm=null;
function ask(o,fn){ pendingConfirm=fn; openSheet('confirm',o); }

/* ---------- import / export ---------- */
function backupJSON(){ return JSON.stringify({app:'reset66',exportedAt:new Date().toISOString(),state:S},null,2); }
async function doExport(){
  const name='reset66-backup-'+today()+'.json', data=backupJSON();
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){ try{ await dl.save({filename:name,data}); toast('Backup saved','download'); }catch(e){ if(e&&e.code==='declined') return; openSheet('text',{title:'Your backup',body:'Downloads aren’t available here. Copy this text and keep it somewhere safe.',value:data,readonly:true}); } return; }
  }catch(e){}
  try{
    const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Backup downloaded','download');
  }catch(e){ openSheet('text',{title:'Your backup',body:'Copy this text and keep it somewhere safe.',value:data,readonly:true}); }
}
function tryImport(text,errId){
  let st;
  try{ st=migrate(JSON.parse(text)); if(!st.startDate||!st.habits.length) throw new Error(); }
  catch(e){ const el=document.getElementById(errId); if(el) el.textContent='That isn’t a valid RESET / 66 backup. Check that you copied the whole file.'; else toast('That file isn’t a valid RESET / 66 backup','x'); return; }
  st.onboarded=true;
  ask({title:'Replace current progress?',body:'This backup starts on '+nice(st.startDate,{day:'numeric',month:'long',year:'numeric'})+' and has '+st.habits.length+' habits. Your current progress is kept as a previous version you can restore.',yes:'Import backup'},async()=>{
    await keepPrevious(); S=st; persist(); baseline=compute(); applyTheme(); route='today'; closeSheet(); render(); toast('Backup imported','upload');
  });
}

/* ---------- actions ---------- */
const A={
  go(el){ route=el.dataset.to; closeSheet(); render(); window.scrollTo(0,0); },
  toggle(el){
    const id=el.dataset.id, date=el.dataset.date;
    if(date>today()){ toast('That day hasn’t happened yet','lock'); return; }
    if(date<S.startDate) return;
    const r=el.getBoundingClientRect();
    commit(()=>{ const arr=new Set(S.completions[date]||[]); arr.has(id)?arr.delete(id):arr.add(id); if(arr.size) S.completions[date]=[...arr]; else delete S.completions[date]; },r);
    const again=document.querySelector('[data-a="toggle"][data-id="'+id+'"][data-date="'+date+'"] .check'); if(again) again.classList.add('pop');
  },
  day(el){ const d=el.dataset.date; if(d>today()){ toast('Day '+(diff(S.startDate,d)+1)+' opens on '+nice(d,{weekday:'short',day:'numeric',month:'short'}),'lock'); return; } openSheet('day',d); },
  habit(el){ openSheet('habit',el.dataset.id); },
  path(){ openSheet('path'); },
  newHabit(){ openSheet('editor',null); },
  editHabit(el){ openSheet('editor',{id:el.dataset.id}); },
  hfIcon(el){ syncForm(); sheet.form.icon=el.dataset.v; renderSheet(false,true); },
  hfMode(el){ syncForm(); sheet.form.mode=el.dataset.v; renderSheet(false,true); },
  hfDay(el){ syncForm(); const v=+el.dataset.v, d=sheet.form.days; const i=d.indexOf(v); i>=0?d.splice(i,1):d.push(v); renderSheet(false,true); },
  hfSave(){
    syncForm(); const f=sheet.form, err=document.getElementById('hf-err');
    const stages=f.stages?f.stages.map(v=>v.trim()):null;
    if(stages&&stages.some(v=>!v)){ err.textContent='Give every level a name.'; return; }
    const name=stages?stages[0]:f.name.trim();
    if(!name){ err.textContent='Give your habit a name.'; document.getElementById('hf-name').focus(); return; }
    if(f.mode==='some'&&!f.days.length){ err.textContent='Choose at least one day, or switch to every day.'; return; }
    const days=f.mode==='some'?[...f.days].sort():[];
    const id=sheet.arg&&sheet.arg.id;
    commit(()=>{
      if(id){ const h=S.habits.find(x=>x.id===id); if(h){ h.name=name; h.icon=f.icon; h.category=f.category; h.days=days; if(stages&&h.ladder) h.ladder=h.ladder.map((s,i)=>({d:s.d,name:stages[i]})); } }
      else{ const t=today(); S.habits.push({id:uid(),name,icon:f.icon,category:f.category,days,createdOn:S.startDate&&t>S.startDate?t:null,archivedOn:null}); }
    });
    closeSheet(); toast(id?'Habit updated':'Habit added');
  },
  unlockNow(el){ const id=el.dataset.id; commit(()=>{ const h=S.habits.find(x=>x.id===id); if(h){ h.unlock=null; if(S.startDate&&today()>S.startDate) h.createdOn=today(); } }); closeSheet(); toast('Habit unlocked. It’s on today’s list.','zap'); },
  archive(el){ const id=el.dataset.id; commit(()=>{ const h=S.habits.find(x=>x.id===id); if(h) h.archivedOn=today(); }); closeSheet(); toast('Habit archived','archive'); },
  unarchive(el){ const id=el.dataset.id; commit(()=>{ const h=S.habits.find(x=>x.id===id); if(h) h.archivedOn=null; }); toast('Habit restored','rotate'); },
  askDelete(el){ const id=el.dataset.id, h=S.habits.find(x=>x.id===id); if(!h) return;
    ask({title:'Delete this habit?',body:'“'+esc(hName(h))+'” and its whole history will be removed, along with the XP it earned. Archive it instead if you want to keep the record.',yes:'Delete habit',danger:true},()=>{
      commit(()=>{ S.habits=S.habits.filter(x=>x.id!==id); for(const d of Object.keys(S.completions)){ const a=S.completions[d].filter(x=>x!==id); if(a.length) S.completions[d]=a; else delete S.completions[d]; } });
      closeSheet(); toast('Habit deleted','trash'); }); },
  confirmYes(){ const fn=pendingConfirm; pendingConfirm=null; if(fn) fn(); },
  close(){ closeSheet(); },
  theme(el){ S.theme=el.dataset.v; applyTheme(); persist(); render(); },
  editStart(){ openSheet('start'); },
  saveStart(){ const v=document.getElementById('sd').value; if(!isDate(v)){ document.getElementById('sd-err').textContent='Pick a valid date.'; return; }
    commit(()=>{ S.startDate=v; }); closeSheet(); toast('Start date updated','calendar'); },
  export(){ doExport(); },
  copyBackup(){ openSheet('text',{title:'Backup as text',body:'Copy this and keep it somewhere safe. You can paste it back in with Import progress.',value:backupJSON(),readonly:true}); },
  async copyText(){ const ta=document.getElementById('tx'); ta.select(); let ok=false; try{ await navigator.clipboard.writeText(ta.value); ok=true; }catch(e){ try{ ok=document.execCommand('copy'); }catch(_){} } toast(ok?'Copied':'Select the text and copy it manually',ok?'check':'copy'); },
  import(){ openSheet('text',{title:'Import progress',body:'Choose a backup file, or paste the text of one below.',readonly:false}); },
  pickFile(){ document.getElementById('file-import').click(); },
  importText(){ tryImport(document.getElementById('tx').value,'tx-err'); },
  reset(){ ask({title:'Reset the challenge?',body:'This clears your habits, history, XP and achievements, then takes you back to the start. Your current progress is kept as a previous version you can restore from Settings.',yes:'Reset everything',danger:true},async()=>{
      await keepPrevious(); const theme=S.theme; S=blank(); S.theme=theme; persist(); baseline=null; obInit(); closeSheet(); route='today'; render(); window.scrollTo(0,0); }); },
  newChallenge(){ A.reset(); },
  newSeason(){ openSheet('newSeason'); },
  nsPick(el){ const k=sheet.form.keep, id=el.dataset.id, i=k.indexOf(id); i>=0?k.splice(i,1):k.push(id); renderSheet(false,true); },
  nsStart(el){ sheet.form.start=el.dataset.v; renderSheet(false,true); },
  async nsGo(){
    const f=sheet.form, keep=new Set(f.keep);
    if(S.habits.some(h=>!h.archivedOn)&&!keep.size){ document.getElementById('ns-err').textContent='Keep at least one habit. You can add new ones after you start.'; return; }
    await keepPrevious();
    const c=compute(), nx=S.season+1, start=f.start==='tomorrow'?addDays(today(),1):today();
    if(c.day>=1) archiveSeason(c);
    S.habits=S.habits.filter(h=>!h.archivedOn&&keep.has(h.id)).map(h=>Object.assign({},h,{name:hName(h),createdOn:null,archivedOn:null,unlock:null,ladder:null}));
    S.season=nx; S.startDate=start; S.completions={};
    persist(); baseline=compute(); closeSheet(); route='today'; render(); window.scrollTo(0,0);
    toast('Season '+nx+' started. Day 1 begins '+(start===today()?'now':'tomorrow'),'flame');
  },
  seasonView(el){ openSheet('seasonView',+el.dataset.i); },
  coach(){ openSheet('coach'); },
  coGoal(el){ const g=sheet.form.goals, k=el.dataset.k, i=g.indexOf(k); if(i>=0) g.splice(i,1); else if(g.length<3) g.push(k); else{ toast('Pick up to 3 for now. You can add more later.','target'); return; } renderSheet(false,true); },
  coNext(){ sheet.form.step=1; coachRender(); },
  coTime(el){ sheet.form.time=el.dataset.v; sheet.form.step=2; coachRender(); },
  coLevel(el){ const f=sheet.form; f.level=+el.dataset.v; f.plan=buildPlan(f.goals,f.time,f.level,coachBase()); f.step=3; coachRender(); },
  coBack(){ const f=sheet.form; f.step=Math.max(0,f.step-1); f.plan=null; renderSheet(false,true); },
  coRestart(){ sheet.form=null; renderSheet(false,true); document.querySelector('.sheet').scrollTop=0; },
  coDrop(el){ const f=sheet.form; f.plan.splice(+el.dataset.i,1); const base=coachBase();
    f.plan=f.plan.map((p,i)=>planItem(p.k,f.level,i<2?base:base+UNLOCK_GAP*(i-1))).filter(p=>p.unlock<=TOTAL-7); renderSheet(false,true); },
  coUse(){
    const plan=sheet.form.plan;
    if(!S.onboarded){ OB.plan=plan; OB.step=3; closeSheet(); render(); window.scrollTo(0,0); const o=document.querySelector('.ob'); if(o) o.scrollTop=0; return; }
    const t=today(), c=compute(), dn=Math.max(1,c.day);
    commit(()=>{
      if(!c.started) S.habits=S.habits.filter(h=>h.archivedOn); /* nothing to keep before Day 1 */
      for(const h of S.habits) if(!h.archivedOn) h.archivedOn=t;
      for(const p of plan) S.habits.push(planHabit(p,dn,c.started&&t>S.startDate?t:null));
    });
    closeSheet(); route='today'; render(); window.scrollTo(0,0); toast('Your plan is set. Start with the first '+Math.min(2,plan.length)+'.','zap');
  },
  async restorePrev(){
    let p=null; if(Store.idb) p=await idbGet(PREV); if(!p&&lsOK) p=lsGet(PREV);

      const cur=JSON.parse(JSON.stringify(S)); S=st; S.onboarded=true; persist(); if(cur.onboarded) await rawSave(PREV,cur); baseline=compute(); applyTheme(); route='today'; closeSheet(); render(); toast('Previous version restored','rotate'); });
  },
  obNext(){ if(OB.step===1){ for(const g of GOALS) if(OB.goals.has(g.k)) g.h.forEach(k=>OB.picked.add(k)); }

    OB.step=Math.min(3,OB.step+1); render(); window.scrollTo(0,0); const o=document.querySelector('.ob'); if(o) o.scrollTop=0; },
  obBack(){ if(OB.plan&&OB.step===3){ OB.plan=null; OB.step=0; } else OB.step=Math.max(0,OB.step-1); render(); },
  obGoal(el){ const k=el.dataset.k; OB.goals.has(k)?OB.goals.delete(k):OB.goals.add(k); keepScroll(render); },
  obPick(el){ const k=el.dataset.k; OB.picked.has(k)?OB.picked.delete(k):OB.picked.add(k); keepScroll(render); },
  obAddCustom(){ keepScroll(obAddCustom); },
  obRemoveCustom(el){ OB.custom.splice(+el.dataset.i,1); keepScroll(render); },
  obStart(el){ const v=el.dataset.v; OB.startMode=v; if(v==='today') OB.start=today(); if(v==='tomorrow') OB.start=addDays(today(),1); keepScroll(render); },
  obFinish(){ if(OB.startMode==='custom'){ const v=document.getElementById('ob-date').value; if(isDate(v)) OB.start=v; } obFinish(); }
};
function coachBase(){ if(!S.onboarded||!S.startDate) return 1; const c=compute(); return Math.max(1,c.day); }
function coachRender(){ renderSheet(false,true); const s=document.querySelector('.sheet'); if(s) s.scrollTop=s.scrollHeight; }
function planHabit(p,dn,createdOn){ return {id:uid(),name:p.ladder[0].name,icon:p.icon,category:p.category,days:[],createdOn,archivedOn:null,unlock:p.unlock>dn?p.unlock:null,ladder:p.ladder.length>1?p.ladder:null}; }
function keepScroll(fn){ const o=document.querySelector('.ob'), y=o?o.scrollTop:0; fn(); const o2=document.querySelector('.ob'); if(o2) o2.scrollTop=y; }
function noAnim(){ const s=document.querySelector('.sheet'); if(s) s.style.animation='none'; const sc=document.querySelector('.scrim'); if(sc) sc.style.animation='none'; }
function syncForm(){ if(!sheet||!sheet.form) return; const nm=document.getElementById('hf-name'), ct=document.getElementById('hf-cat'); if(nm) sheet.form.name=nm.value; if(ct) sheet.form.category=ct.value;
  if(sheet.form.stages) sheet.form.stages=sheet.form.stages.map((v,i)=>{ const el=document.getElementById('hf-st-'+i); return el?el.value:v; }); }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.disabled) return;
  if(el.dataset.a==='scrim'){ if(e.target===el) closeSheet(); return; }
  const fn=A[el.dataset.a]; if(fn){ if(el.tagName==='BUTTON') e.preventDefault(); try{ fn(el,e); }catch(err){ console.error(err); toast('Something went wrong. Your saved progress is safe.','x'); } }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet) closeSheet();
  if(e.key==='Enter'&&e.target.id==='ob-custom'){ e.preventDefault(); keepScroll(obAddCustom); }
  if(e.key==='Enter'&&e.target.id==='hf-name'){ e.preventDefault(); A.hfSave(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='ob-date'&&isDate(e.target.value)){ OB.start=e.target.value; keepScroll(render); }
  if(e.target.id==='file-import'){ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
    const r=new FileReader(); r.onload=()=>tryImport(String(r.result),'tx-err'); r.onerror=()=>toast('That file couldn’t be read','x'); r.readAsText(f); }
});
/* re-render when the day changes (e.g. app left open past midnight) */
let lastDay=today();
function dayCheck(){ if(today()!==lastDay){ lastDay=today(); if(S.onboarded){ const prev=baseline; baseline=compute(); if(prev&&baseline.shieldsUsed>prev.shieldsUsed) toast('A streak shield saved your streak','shield',true); render(); } } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) dayCheck(); });
setInterval(dayCheck,30000);

/* PWA extras only when hosted as a standalone site (not inside the Claude viewer) */
function standaloneExtras(){
  let framed=true; try{ framed=window.top!==window.self; }catch(e){}
  if(framed||/claude/.test(location.hostname)||!(location.protocol==='https:'||location.hostname==='localhost')) return;
  const l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- boot ---------- */
(async function boot(){
  root.innerHTML='<main class="app"><p class="muted" style="padding-top:40vh;text-align:center">Loading…</p></main>';
  let loaded=null;
  try{ loaded=await storeInit(); }catch(e){ loaded=null; }
  if(loaded) S=loaded;
  applyTheme(); baseline=S.onboarded?compute():null; render();
  standaloneExtras();
  cloudInit();
  window.__reset66={state:()=>S,compute,store:()=>Store.mode,aura:auraSVG};
})();
})();
</script>
